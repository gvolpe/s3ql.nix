name: Build

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2.3.2

      - name: "Install Nix ❄️"
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v17
        with:
          name: gvolpe-nixos
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Build s3ql package ❄️"
        run: nix build --no-link --show-trace

      - name: "NixOS module test ❄️"
        run: nix build .#checks.x86_64-linux.s3ql-module --no-link --show-trace
