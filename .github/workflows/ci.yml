name: NixOS

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2.3.2

      - name: "Install Nix ❄️"
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: "Install Cachix ❄️"
        uses: cachix/cachix-action@v17
        with:
          name: gvolpe-nixos
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Assert S3QL version ❄️"
        run: |
          version="$(nix develop -c s3qlstat --version)"
          test "$version" = "S3QL 5.3.0" || {
            echo "Expected S3QL 5.3.0, got: $version"
            exit 1
          }

      - name: "Nix flake check ❄️"
        run: nix flake check --no-build --show-trace
